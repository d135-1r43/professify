version: 2
updates:
  # Java dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ (maven)"
    groups:
      # Quarkus platform, extensions and Quarkiverse move in lockstep
      quarkus:
        patterns:
          - "io.quarkus:*"
          - "io.quarkiverse*:*"
      # Test-only tooling, safe to batch
      test-tooling:
        patterns:
          - "*"
        dependency-type: "development"
      # Everything else, low-risk updates batched into one PR
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Container base images
  - package-ecosystem: "docker"
    directory: "/src/main/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ (docker)"
    groups:
      docker-base-images:
        patterns:
          - "*"

  # GitHub Actions used by the CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ (actions)"
    groups:
      github-official-actions:
        patterns:
          - "actions/*"
          - "github/*"
      docker-actions:
        patterns:
          - "docker/*"
      other-actions:
        patterns:
          - "*"
