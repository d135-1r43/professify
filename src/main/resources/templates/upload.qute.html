<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Professify - Professional Headshot Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #4695EB;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #888;
            margin-bottom: 2rem;
        }
        .upload-area {
            border: 2px dashed #4695EB;
            border-radius: 16px;
            padding: 40px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #be9100;
            background: rgba(70, 149, 235, 0.1);
        }
        .upload-area.dragover {
            border-color: #be9100;
            background: rgba(190, 145, 0, 0.1);
        }
        #fileInput {
            display: none;
        }
        .btn {
            background: linear-gradient(135deg, #4695EB 0%, #3a7bc8 100%);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(70, 149, 235, 0.4);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .images {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .image-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            min-width: 280px;
            max-width: 380px;
        }
        .image-box h3 {
            margin: 0 0 10px 0;
            color: #be9100;
        }
        .image-box img {
            max-width: 100%;
            border-radius: 8px;
            display: block;
        }
        .placeholder {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }
        .loading {
            display: none;
            margin: 20px 0;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4695EB;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .download-btn {
            display: none;
            margin-top: 10px;
            background: linear-gradient(135deg, #be9100 0%, #9a7700 100%);
        }
        .download-btn.visible {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Professify</h1>
        <p class="subtitle">Transform your selfie into an executive-level professional headshot</p>

        <div class="upload-area" id="dropZone">
            <p>Drag & drop your selfie here or click to browse</p>
            <input type="file" id="fileInput" accept="image/jpeg,image/png">
        </div>

        <button class="btn" id="generateBtn" disabled>Generate Professional Headshot</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Transforming your image...</p>
        </div>

        <div class="images">
            <div class="image-box">
                <h3>Original</h3>
                <div class="placeholder" id="originalPlaceholder">No image selected</div>
                <img id="originalImg" style="display:none;">
            </div>
            <div class="image-box">
                <h3>Professional Headshot</h3>
                <div class="placeholder" id="resultPlaceholder">Result will appear here</div>
                <img id="resultImg" style="display:none;">
                <button class="btn download-btn" id="downloadBtn">Download</button>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const originalImg = document.getElementById('originalImg');
        const originalPlaceholder = document.getElementById('originalPlaceholder');
        const resultImg = document.getElementById('resultImg');
        const resultPlaceholder = document.getElementById('resultPlaceholder');
        const downloadBtn = document.getElementById('downloadBtn');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.match(/^image\/(jpeg|png)$/)) {
                alert('Please select a JPEG or PNG image');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImg.src = e.target.result;
                originalImg.style.display = 'block';
                originalPlaceholder.style.display = 'none';
                generateBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        generateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            generateBtn.disabled = true;
            loading.classList.add('active');
            resultImg.style.display = 'none';
            resultPlaceholder.style.display = 'flex';
            resultPlaceholder.textContent = 'Processing...';
            downloadBtn.classList.remove('visible');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/image', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Generation failed');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                resultImg.src = url;
                resultImg.style.display = 'block';
                resultPlaceholder.style.display = 'none';
                downloadBtn.classList.add('visible');

                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'professional-headshot.png';
                    a.click();
                };
            } catch (err) {
                resultPlaceholder.textContent = 'Error: ' + err.message;
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
